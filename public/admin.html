<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kroma Studio - Administrador</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 class="logo">KROMA<span>STUDIO</span></h1>
        <nav>
            <a href="#inicio">Início</a>
            <a href="#agendamentos">Agendamentos</a>
            <a href="#clientes">Clientes</a>
            <button id="btnSair" class="btn btn-outline" style="padding: 6px 12px; font-size: 13px;">Sair</button>
        </nav>
    </header>

    <main>

        <section id="inicio" class="secao">
            <h2>Painel Administrativo</h2>
            <p>Bem-vindo ao painel de gerenciamento do Kroma Studio.</p>

            <div class="servicos" style="margin-top: 20px;">
                <div class="card servicos article" style="background: #2c2c2c; padding: 20px; border-bottom: 3px solid var(--destaque);">
                    <h3>Total de Agendamentos</h3>
                    <p id="totalAgendamentos" style="font-size: 24px; font-weight: bold; color: var(--destaque);">0</p>
                </div>

                <div class="card" style="background: #2c2c2c; padding: 20px; border-bottom: 3px solid var(--destaque);">
                    <h3>Pendentes</h3>
                    <p id="agendamentosPendentes" style="font-size: 24px; font-weight: bold; color: var(--destaque);">0</p>
                </div>

                <div class="card" style="background: #2c2c2c; padding: 20px; border-bottom: 3px solid var(--destaque);">
                    <h3>Concluídos</h3>
                    <p id="agendamentosConcluidos" style="font-size: 24px; font-weight: bold; color: var(--destaque);">0</p>
                </div>

                <div class="card" style="background: #2c2c2c; padding: 20px; border-bottom: 3px solid var(--destaque);">
                    <h3>Total de Clientes</h3>
                    <p id="totalClientes" style="font-size: 24px; font-weight: bold; color: var(--destaque);">0</p>
                </div>
            </div>
        </section>

        <section id="agendamentos" class="secao">
            <h2>Gerenciar Agendamentos</h2>

            <input
                type="text"
                id="buscarAgendamento"
                placeholder="Buscar agendamento..."
                style="margin-bottom: 20px;"
            >

            <div id="listaAgendamentos">
            </div>
        </section>

        <section id="clientes" class="secao">
            <h2>Gerenciar Clientes</h2>

            <input
                type="text"
                id="buscarCliente"
                placeholder="Buscar cliente..."
                style="margin-bottom: 20px;"
            >

            <div id="listaClientes">
            </div>
        </section>

    </main>

    <footer>
        <p>KROMA STUDIO - Painel Administrativo</p>
    </footer>

    <script src="javascript/admin.js"></script>

</body>
</html>
